<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08070d" />
    <title>Ingen anslutning – StorageViewr</title>
    <style>
      :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
      body { position: fixed; inset: 0; background: #08070d; color: #f3f0f7; }
      main { width: min(100%, 560px); height: 100dvh; min-height: 0; margin: 0 auto; padding: max(40px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(40px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left)); display: flex; flex-direction: column; overflow-y: auto; overscroll-behavior-y: contain; -webkit-overflow-scrolling: touch; }
      .brand { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; }
      section { flex-shrink: 0; margin: auto 0; padding: 22px; border: 1px solid rgba(255,255,255,.09); border-radius: 14px; background: #100e17; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.025); }
      .eyebrow { margin: 0 0 14px; color: #aa88ff; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
      h1 { margin: 0 0 14px; font-size: 22px; letter-spacing: -0.03em; }
      p { margin: 0 0 26px; color: #aaa4b5; font-size: 14px; line-height: 1.75; }
      button { width: 100%; min-height: 48px; border: 1px solid rgba(170,136,255,.48); border-radius: 10px; background: #956af7; color: white; font: inherit; font-size: 14px; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <svg width="26" height="28" viewBox="0 0 24 26" fill="none" aria-hidden="true"><path d="M12 1 23 7 12 13 1 7 12 1Z" fill="#bda5ff"/><path d="M1 8 11.5 13.7V25L1 19V8Z" fill="#9254db"/><path d="m12.5 13.7 10.5-5.7v11l-10.5 6V13.7Z" fill="#c6a4f5"/></svg>
        <span>StorageViewr</span>
      </div>
      <section>
        <p class="eyebrow">Ingen anslutning</p>
        <h1>Du verkar vara offline.</h1>
        <p>Anslut till internet och försök igen. Lagerdata sparas inte i webbläsarens offlinecache.</p>
        <button type="button" onclick="window.location.reload()">Försök igen</button>
      </section>
    </main>
  </body>
</html>
