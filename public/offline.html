<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090810" />
    <title>Ingen anslutning – StorageViewr</title>
    <style>
      :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100svh; background: #090810; color: #f6f3ff; }
      main { width: min(100%, 560px); min-height: 100vh; min-height: 100svh; margin: 0 auto; padding: 40px 20px; display: flex; flex-direction: column; }
      .brand { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; }
      .mark { width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid rgba(167, 120, 255, 0.45); border-radius: 12px; background: rgba(124, 58, 237, 0.12); color: #bda5ff; }
      .dot { color: #bda5ff; }
      section { margin: auto 0; padding: 28px; border: 1px solid #393047; border-radius: 18px; background: #13111f; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03); }
      .eyebrow { margin: 0 0 14px; color: #bda5ff; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
      h1 { margin: 0 0 14px; font-size: 30px; letter-spacing: -0.03em; }
      p { margin: 0 0 26px; color: #b8b1ca; font-size: 14px; line-height: 1.75; }
      button { width: 100%; min-height: 52px; border: 1px solid rgba(192, 132, 252, 0.4); border-radius: 12px; background: linear-gradient(115deg, #7934d8, #5921bb 65%, #4c27a1); color: white; font: inherit; font-size: 14px; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <span class="mark" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="m12 3 9 5v8l-9 5-9-5V8l9-5Zm0 9 9-4M12 12 3 8m9 4v9" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
          </svg>
        </span>
        <span>StorageViewr<span class="dot">.</span></span>
      </div>
      <section>
        <p class="eyebrow">Ingen anslutning</p>
        <h1>Du verkar vara offline.</h1>
        <p>Anslut till internet och försök igen. Lagerdata sparas inte i webbläsarens offlinecache.</p>
        <button type="button" onclick="window.location.reload()">Försök igen</button>
      </section>
    </main>
  </body>
</html>
